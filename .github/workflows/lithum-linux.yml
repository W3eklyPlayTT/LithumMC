name: Build Lithum Linux server

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/lithum-linux.yml
      - jar-launcher/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    name: Linux x86_64 server
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select stable Rust
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lithum-linux-x86_64

      - name: Build optimized server
        run: cargo build --locked --release --package pumpkin --bin lithum-server

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Package Linux executable and hosting JAR
        run: |
          mkdir -p dist
          install -m 755 target/release/lithum-server dist/lithum-server-linux-x86_64
          sha256sum dist/lithum-server-linux-x86_64 > dist/lithum-server-linux-x86_64.sha256
          mkdir -p target/lithum-jar-stage/native
          javac -d target/lithum-jar-stage jar-launcher/LithumLauncher.java
          cp target/release/lithum-server target/lithum-jar-stage/native/lithum-server-linux-x86_64
          jar --create --file dist/LithumServer.jar --manifest jar-launcher/MANIFEST.MF -C target/lithum-jar-stage .
          sha256sum dist/LithumServer.jar > dist/LithumServer.jar.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: LithumServer-linux-x86_64
          path: |
            dist/lithum-server-linux-x86_64
            dist/lithum-server-linux-x86_64.sha256
            dist/LithumServer.jar
            dist/LithumServer.jar.sha256
          retention-days: 90
