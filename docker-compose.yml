services:
  lithummc:
    build: .
    ports:
      - "${SERVER_PORT:-25565}:${SERVER_PORT:-25565}/tcp"
      - "19132:19132/udp"
    environment:
      SERVER_PORT: "${SERVER_PORT:-25565}"
    volumes:
      - ./data:/lithummc
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
