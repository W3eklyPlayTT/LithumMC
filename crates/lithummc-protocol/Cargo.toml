[package]
name = "lithummc-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["query"]
serverbound = []
clientbound = []
query = []

[dependencies]
lithummc-nbt.workspace = true
lithummc-data = { workspace = true, features = ["default", "bedrock_creative", "bedrock_biome"] }
lithummc-macros.workspace = true
lithummc-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

uuid.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync"] }
bytes.workspace = true

# encryption
aes.workspace = true
cfb8.workspace = true
hybrid-array = "0.4"

# compression
flate2.workspace = true

bitflags.workspace = true
base64.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Validate correctness

[lints]
workspace = true
